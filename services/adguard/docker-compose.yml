# Candidate desired-state seed for adguard.
# Generated from sanitized archived run scripts and NAS directory metadata.
# Do not apply blindly; verify live intent, secrets, image digests, and port conflicts first.
services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "67:67/udp"
      - "68:68/udp"
      - "81:80/tcp"
      - "444:443/tcp"
      - "444:443/udp"
      - "3000:3000/tcp"
      - "853:853/tcp"
      - "784:784/udp"
      - "853:853/udp"
      - "8853:8853/udp"
      - "5443:5443/tcp"
      - "5443:5443/udp"
    volumes:
      - /mnt/nas/services/adguard/work:/opt/adguardhome/work
      - /mnt/nas/services/adguard/config:/opt/adguardhome/conf
