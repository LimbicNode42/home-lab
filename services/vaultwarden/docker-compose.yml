# Candidate desired state for the existing Vaultwarden deployment.
#
# Status: imported/read-only from the live service and archived bootstrap script.
# Do not apply blindly. Compare against `docker inspect vaultwarden` on critical
# before replacing the running container.

services:
  vaultwarden:
    # Pinned to the currently running container image inspected on 2026-05-22.
    image: vaultwarden/server@sha256:9a8eec71f4a52411cc43edc7a50f33e9b6f62b5baca0dd95f0c6e7fd60f1a341
    container_name: vaultwarden
    restart: unless-stopped
    user: "1001:1003"
    ports:
      - "8084:80"
    env_file:
      - .env
    volumes:
      - /mnt/nas/services/vaultwarden/data:/data
      # Enable only if the production DATABASE_URL uses sslmode=verify-full.
      # - /mnt/nas/services/postgres/certs/postgres.crt:/opt/postgres/certs/postgres.crt:ro
    # Live docker inspect on 2026-05-22 shows the image-provided healthcheck.
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 60s
      timeout: 10s
