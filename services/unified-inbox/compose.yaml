services:
  unified-inbox:
    build: .
    image: unified-inbox:local
    container_name: unified-inbox
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8766
      UNIFIED_INBOX_RUNTIME_ROOT: /app/state
      UNIFIED_INBOX_NAS_ROOT: /app/nas-export
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      # Host-local writable state. Do not place this on NAS/NFS.
      - /var/lib/unified-inbox:/app/state
      # Immutable NAS export surface after batch close.
      - /mnt/nas/services/unified-inbox:/app/nas-export
