# Candidate desired-state seed for sonarr.
# Generated from sanitized archived run scripts and NAS directory metadata.
# Do not apply blindly; verify live intent, secrets, image digests, and port conflicts first.
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.13
    container_name: sonarr
    restart: unless-stopped
    environment:
      PUID: "1001"
      PGID: "1003"
      TZ: Australia/Sydney
    ports:
      - "8989:8989"
    volumes:
      - /mnt/nas/services/sonarr/config:/config
      - /mnt/nas/media/tv:/tv
      - /mnt/nas/media/downloads:/downloads
