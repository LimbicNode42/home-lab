[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-reconciler"
version = "0.1.0"
description = "Curated, idempotent Kanban -> mem0 + Graphiti pipeline (non-secret code layer)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

[project.scripts]
graceful-memory-reconciler = "memory_reconciler.cli:main"

[tool.setuptools.packages.find]
include = ["memory_reconciler*"]