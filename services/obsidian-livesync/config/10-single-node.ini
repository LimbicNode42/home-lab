; CouchDB single-node mode for the self-hosted Obsidian LiveSync backend.
;
; The couchdb:3.3.3 docker entrypoint does NOT read a COUCHDB_SINGLE_NODE env
; var; this file is mounted at /opt/couchdb/etc/local.d/ and sets single-node
; mode directly, so CouchDB does not run the multi-node/cluster path.
;
; This file is non-secret and committed to Git. The admin password is NOT here —
; the entrypoint writes it to /opt/couchdb/etc/local.d/docker.ini (rendered from
; Vaultwarden), which lives on the NAS at
; /mnt/nas/services/obsidian-livesync/config/ and is NOT under Git.

[couchdb]
single_node = true