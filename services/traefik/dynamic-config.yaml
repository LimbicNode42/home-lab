http:
  routers:
    jellyfin:
      entryPoints: web
      rule: "Host(`jellyfin.wheeler-network.com`)"
      service: jellyfin
    dashboard:
      entryPoints: web
      rule: "Host(`dashboard.wheeler-network.com`)"
      middlewares:
        - dashboard-cloudflared-only
      service: dashboard
    traefik:
      entryPoints: web
      rule: "Host(`traefik.wheeler-network.com`)"
      service: traefik
    nas:
      entryPoints: web
      rule: "Host(`nas.wheeler-network.com`)"
      service: nas
    cluster:
      entryPoints: websecure
      rule: "Host(`cluster.wheeler-network.com`)"
      service: cluster
    vault:
      entryPoints: web
      rule: "Host(`vault.wheeler-network.com`)"
      service: vault

  services:
    jellyfin:
      loadBalancer:
        servers:
          - url: http://192.168.0.8:8096
    dashboard:
      loadBalancer:
        servers:
          - url: http://172.17.0.1:4322
    traefik:
      loadBalancer:
        servers:
          - url: http://192.168.0.50:8080
    nas:
      loadBalancer:
        servers:
          - url: http://192.168.0.250
    cluster:
      loadBalancer:
        passHostHeader: true
        serversTransport: "proxmox"
        sticky:
          cookie: {}
        servers:
          - url: https://192.168.0.6:8006
          - url: https://192.168.0.7:8006
          - url: https://192.168.0.8:8006
          - url: https://192.168.0.9:8006
    vault:
      loadBalancer:
        servers:
          - url: http://192.168.0.50:8084

  serversTransports:
    proxmox:
      insecureSkipVerify: true

  middlewares:
    dashboard-cloudflared-only:
      ipWhiteList:
        sourceRange:
          # Dashboard trusts Cloudflare Access identity headers. Only accept
          # requests that enter Traefik from local Docker networks, where the
          # cloudflared container is the expected caller. LAN clients hitting
          # Traefik directly must not be able to forge cf-access-* headers.
          - 172.16.0.0/12
