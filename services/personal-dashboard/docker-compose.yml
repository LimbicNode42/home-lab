services:
  dashboard:
    build:
      context: .
    image: personal-dashboard:local
    container_name: personal-dashboard
    restart: unless-stopped
    ports:
      # Bind only to the Docker bridge host gateway. Traefik runs on the same
      # host and reaches this published port through that gateway
      # (http://172.17.0.1:4322 in services/traefik/dynamic-config.yaml).
      # Do not publish this on the LAN IP: the app trusts Cloudflare Access
      # identity headers after Traefik/cloudflared has performed ingress control.
      - "${DASHBOARD_PUBLISHED_IP:-172.17.0.1}:4322:4322"
    environment:
      NODE_ENV: production
      PORT: "4322"
      HOST: 0.0.0.0
      DASHBOARD_AUTH_MODE: ${DASHBOARD_AUTH_MODE:-reverse-proxy}
      DASHBOARD_PROXY_USER_HEADER: ${DASHBOARD_PROXY_USER_HEADER:-cf-access-authenticated-user-email}
      DASHBOARD_CONFIG_FILE: /app/config/dashboard.public.json
      DASHBOARD_STATUS_CACHE_TTL_MS: ${DASHBOARD_STATUS_CACHE_TTL_MS:-30000}
      DASHBOARD_STATUS_PROBE_TIMEOUT_MS: ${DASHBOARD_STATUS_PROBE_TIMEOUT_MS:-2500}
      KANBAN_DB_PATH: /app/kanban/kanban.db
      FINNICK_REPORT_FILE: /app/finnick/latest_report.txt
      INVESTMENT_SCREENER_REPORT_FILE: /app/investment-screener/latest_report.txt
      INVESTMENT_SCREENER_RANKED_FILE: /app/investment-screener/latest_ranked.json
      PERSONAL_DASHBOARD_DB_FILE: /app/data/personal-dashboard.sqlite3
      REPO_DOCS_ROOT: /app/repo-docs
    volumes:
      # Read-only runtime artifacts are copied from NAS/repo sources into this
      # host-local cache before deploy. Do not mount NAS/NFS paths directly here:
      # Docker can keep stale bind handles after NFS writer replacement/remounts.
      - type: bind
        source: ${PERSONAL_DASHBOARD_RUNTIME_CACHE_DIR:-/var/lib/personal-dashboard/runtime-cache}/config
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PERSONAL_DASHBOARD_RUNTIME_CACHE_DIR:-/var/lib/personal-dashboard/runtime-cache}/finnick
        target: /app/finnick
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PERSONAL_DASHBOARD_RUNTIME_CACHE_DIR:-/var/lib/personal-dashboard/runtime-cache}/investment-screener
        target: /app/investment-screener
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PERSONAL_DASHBOARD_RUNTIME_CACHE_DIR:-/var/lib/personal-dashboard/runtime-cache}/kanban
        target: /app/kanban
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PERSONAL_DASHBOARD_DB_HOST_DIR:-/mnt/nas/services/personal-dashboard/data}
        target: /app/data
        read_only: false
        bind:
          create_host_path: false
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4322/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
