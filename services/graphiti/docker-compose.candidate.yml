# Candidate only. Do not run without review and rendered secrets.
# Expected future path on tori: /opt/graphiti/docker-compose.yml
services:
  neo4j:
    image: neo4j:5.26.2
    container_name: graphiti-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL:-512m}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-1g}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-512m}"
    volumes:
      - type: bind
        source: ${GRAPHITI_NEO4J_DATA_DIR:-/var/lib/graphiti/neo4j/data}
        target: /data
      - type: bind
        source: ${GRAPHITI_NEO4J_LOG_DIR:-/var/log/graphiti/neo4j}
        target: /logs
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    networks:
      - graphiti-internal

  graphiti-api:
    # Set to a reviewed immutable digest before deployment. The spike verified graphiti-core 0.30.2.
    image: ${GRAPHITI_IMAGE:?GRAPHITI_IMAGE must be set to a reviewed immutable digest before deploy}
    container_name: graphiti-api
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      DB_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: "${NEO4J_USER}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
      OPENAI_API_KEY: "${OPENROUTER_API_KEY}"
      OPENAI_BASE_URL: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      MODEL_NAME: "${GRAPHITI_COMPLETION_MODEL:-openai/gpt-4o-mini}"
      SMALL_MODEL_NAME: "${GRAPHITI_COMPLETION_MODEL:-openai/gpt-4o-mini}"
      RERANK_MODEL_NAME: "${GRAPHITI_RERANK_MODEL:-openai/gpt-4o-mini}"
      EMBEDDING_MODEL_NAME: "${GRAPHITI_EMBEDDING_MODEL:-openai/text-embedding-3-small}"
      EMBEDDING_DIM: "${GRAPHITI_EMBEDDING_DIM:-1536}"
    ports:
      # Keep loopback-only unless a later review approves a LAN-only authenticated wrapper.
      - "127.0.0.1:${GRAPHITI_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8000/healthcheck || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - graphiti-internal

networks:
  graphiti-internal:
    driver: bridge
